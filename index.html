<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modulo3-coderhouse</title>
    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
    <header>
        
        <nav class="navbar lg:navbar-expand bg-1 navbar-custom">
            <div class="container-fluid">

                <a class="navbar-brand" href="#">Natural-ES</a>

                <!-- Botón hamburguesa -->
                <button class="btn-icon navbar-toggler"
                    type="button"
                    data-bs-toggle="drawer"
                    data-bs-target="#menuNatural"
                    aria-controls="menuNatural"
                    aria-expanded="false"
                    aria-label="Abrir menú">

                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>

                <!-- Menú responsive de Bootstrap 6 -->
                <dialog class="drawer drawer-end"
                    id="menuNatural"
                    tabindex="-1"
                    aria-labelledby="menuTitulo">

                    <div class="drawer-header">
                        <h5 class="drawer-title" id="menuTitulo">
                            Natural-ES
                        </h5>

                        <button type="button"
                            class="btn-close"
                            data-bs-dismiss="drawer"
                            aria-label="Cerrar menú">
                        </button>
                    </div>

                    <div class="drawer-body">
                        <ul class="navbar-nav">

                            <li class="nav-item">
                                <a class="nav-link active"
                                    aria-current="page" href="#">
                                    Inicio
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="pages/proyectos.html">
                                    Proyectos
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="pages/servicios.html">
                                    Servicios
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="pages/sobre-mi.html">
                                    Sobre Nosotros
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="pages/contacto.html">
                                    Contacto
                                </a>
                            </li>
                        </ul>
                    </div>
                </dialog>
            </div>
        </nav>

    </header>

    <main>
        <section class="grid-section">
            <div class="info-izquierda">
                <h1 class="title">Bienvenidos a mi sitio web</h1>
                <article>
                    <p>Pagina dedicada a la naturaleza y el medio ambiente.</p>
                </article>

                <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#collapseExample" aria-expanded="false" aria-controls="collapseExample">
                    Ver más
                </button>
            </div>
            <div id="carouselExampleFade" class="carousel carousel-fade">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <figure>
                        <img src="src/carrousel1.jpg" class="d-block w-100 rounded-5" alt="Bosque verde con cielo despejado">
                        </figure>
                        <figcaption>Descripción de la imagen 1</figcaption>
                    </div>
                    <div class="carousel-item">
                        <figure>
                        <img src="src/carrousel2.jpg" class="d-block w-100 rounded-5" alt="Bosque estilo otoño con pasto seco">
                        </figure>
                        <figcaption>Descripción de la imagen 2</figcaption>
                    </div>
                    <div class="carousel-item">
                        <figure>
                        <img src="src/carrousel3.jpg" class="d-block w-100 rounded-5" alt="camino de tierra con árboles y pasto verde">
                        </figure>
                        <figcaption>Descripción de la imagen 3</figcaption>
                    </div>
                </div>
                <div>
                    <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="prev">
                        <span class="carousel-icon-prev" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="next">
                        <span class="carousel-icon-next" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 - Mi sitio web.</p>
    </footer>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
